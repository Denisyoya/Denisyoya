<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="100%" height="340">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes glow {
        0%, 100% { stroke: #30363D; }
        50% { stroke: #58A6FF; }
      }
      .code-font {
        font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
        font-size: 13.5px;
        fill: #C9D1D9;
      }
      .kw { fill: #FF7B72; font-weight: bold; }
      .fn { fill: #D2A8FF; }
      .str { fill: #A5D6FF; }
      .comment { fill: #8B949E; font-style: italic; }
      .num { fill: #79C0FF; }
      .var { fill: #FFA657; }
      .cursor {
        fill: #58A6FF;
        animation: blink 1s infinite;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="778" height="338" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1.5" style="animation: glow 6s infinite;" />

  <path d="M 1 9 C 1 4.5 4.5 1 9 1 L 771 1 C 775.5 1 779 4.5 779 9 L 779 38 L 1 38 Z" fill="#161B22" />
  <circle cx="20" cy="20" r="5.5" fill="#FF5F56" />
  <circle cx="38" cy="20" r="5.5" fill="#FFBD2E" />
  <circle cx="56" cy="20" r="5.5" fill="#27C93F" />

  <rect x="80" y="6" width="160" height="32" rx="4" fill="#0D1117" />
  <text x="100" y="27" font-family="'Fira Code', monospace" font-size="12" fill="#58A6FF" font-weight="600">denis_engine.js</text>
  <circle cx="225" cy="22" r="3" fill="#58A6FF" />

  <text x="260" y="27" font-family="'Fira Code', monospace" font-size="12" fill="#8B949E">gamemode.pwn</text>

  <rect x="1" y="39" width="45" height="298" fill="#090D12" />
  <g font-family="'Fira Code', monospace" font-size="12" fill="#484F58" text-anchor="end">
    <text x="35" y="68">1</text>
    <text x="35" y="93">2</text>
    <text x="35" y="118">3</text>
    <text x="35" y="143">4</text>
    <text x="35" y="168">5</text>
    <text x="35" y="193">6</text>
    <text x="35" y="218">7</text>
    <text x="35" y="243">8</text>
    <text x="35" y="268">9</text>
    <text x="35" y="293">10</text>
    <text x="35" y="318">11</text>
  </g>

  <g class="code-font" transform="translate(60, 0)">
    <text x="0" y="68"><tspan class="kw">const</tspan> { <tspan class="fn">BotEngine</tspan>, <tspan class="fn">ServerClient</tspan> } = <tspan class="fn">require</tspan>(<tspan class="str">'@denisyoya/core'</tspan>);</text>
    <text x="0" y="93"><tspan class="kw">const</tspan> <tspan class="var">system</tspan> = <tspan class="kw">new</tspan> <tspan class="fn">BotEngine</tspan>({ <tspan class="var">target</tspan>: [<tspan class="str">'Discord'</tspan>, <tspan class="str">'WhatsApp'</tspan>, <tspan class="str">'Telegram'</tspan>] });</text>
    <text x="0" y="118"><tspan class="comment">// Realtime request pipelines, cURL automation &amp; MySQL databases</tspan></text>
    <text x="0" y="143"><tspan class="var">system</tspan>.<tspan class="fn">on</tspan>(<tspan class="str">'ready'</tspan>, <tspan class="kw">async</tspan> () =&gt; {</text>
    <text x="20" y="168"><tspan class="kw">await</tspan> <tspan class="var">system</tspan>.<tspan class="fn">syncDatabase</tspan>({ <tspan class="var">host</tspan>: <tspan class="str">'127.0.0.1'</tspan>, <tspan class="var">status</tspan>: <tspan class="str">'ONLINE'</tspan> });</text>
    <text x="20" y="193"><tspan class="fn">console</tspan>.<tspan class="fn">log</tspan>(<tspan class="str">'[SUCCESS] Denisyoya Core Engine Active'</tspan>);</text>
    <text x="0" y="218">});</text>
    <text x="0" y="243"><tspan class="comment">/* SA-MP Modular Pawn System */</tspan></text>
    <text x="0" y="268"><tspan class="kw">public</tspan> <tspan class="fn">OnGameModeInit</tspan>() { <tspan class="fn">printf</tspan>(<tspan class="str">&quot;Modular Pawn Running&quot;</tspan>); <tspan class="kw">return</tspan> <tspan class="num">1</tspan>; } <rect x="550" y="254" width="8" height="17" rx="1" class="cursor" /></text>
    <text x="0" y="318" fill="#58A6FF" font-size="12" font-weight="600">[SYSTEM] CORE ENGINE RUNNING &amp; READY</text>
  </g>
</svg>