name: Generate github-contribution-grid-snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake svgs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark
            output/github-contribution-grid-snake-white.svg?palette=github-light

      - name: Commit and push generated svgs
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          author_email: actions@github.com
          message: "chore: generate github contribution snake svgs"
